[version]
current = "0.2.1"
regex = '''(?P<major>\d+)\.(?P<minor>\d+)\.(?P<patch>\d+)'''

[git]
tag_template = "v{new_version}"
message_template = "release: v{new_version}"

[[file]]
src = "version.txt"

[[file]]
src = "pixi.toml"

[[file]]
src = "demo/Doxyfile"
search = 'PROJECT_NUMBER         = "{current_version}"'

[[file]]
src = "demo/src/yoda.hpp"
search = '@version {current_version}'

[[file]]
src = "action.yml"
search = 'default: "{current_version}"'

[[file]]
src = "readme.org"
search = "HaoZeke/doxyYoda@v{current_version}"

[[file]]
src = "readme.org"
search = "=version=          | ={current_version}="

[[file]]
src = "MIGRATION.org"
search = "HaoZeke/doxyYoda@v{current_version}"

[[file]]
src = "MIGRATION.org"
search = "doxyYoda_{current_version}.tar.gz"
