<!-- HTML header for doxygen >= 1.17 (tested with 1.17.0 and 1.18.0) -->

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="generator" content="Doxygen $doxygenversion"/>
<!--BEGIN PROJECT_NAME--><title>$projectname: $title</title><!--END PROJECT_NAME-->
<!--BEGIN !PROJECT_NAME--><title>$title</title><!--END !PROJECT_NAME-->
<!--BEGIN PROJECT_ICON-->
<link rel="icon" href="$relpath^$projecticon" type="image/x-icon" />
<!--END PROJECT_ICON-->
<link href="$relpath^tabs.css" rel="stylesheet" type="text/css"/>
<!--BEGIN FULL_SIDEBAR-->
<meta name="doxygen-page-layout" content="1" />
<script type="text/javascript">var page_layout=1;</script>
<!--END FULL_SIDEBAR-->
<!--BEGIN HTML_DYNAMIC_SECTIONS-->
<script type="text/javascript" src="$relpath^dynsections.js"></script>
<!--END HTML_DYNAMIC_SECTIONS-->
<!--BEGIN HTML_CODE_FOLDING-->
<script type="text/javascript" src="$relpath^codefolding.js"></script>
<!--END HTML_CODE_FOLDING-->
$treeview
$search
$mathjax
$darkmode
$mermaidjs
<!-- doxyYoda owns presentation; stock doxygen.css is not linked (theme SCSS covers Doxygen classes). -->
$extrastylesheet
<script type="text/javascript">
/* doxyYoda theme boot: apply stored or OS preference before first paint */
(function () {
  try {
    var stored = localStorage.getItem("doxyYoda-theme");
    var root = document.documentElement;
    if (stored === "dark") {
      root.classList.add("dark");
    } else if (stored === "light") {
      root.classList.add("light");
    } else if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
      root.classList.add("dark");
    }
  } catch (e) { /* private mode */ }
})();
</script>
</head>

<div class="grid-contents">
<!--BEGIN FULL_SIDEBAR-->

</div>
</nav>
<!--END TITLEAREA-->
<!-- end header part -->
<script type="text/javascript">
/* doxyYoda interactive: foldable fragments, copy buttons, dark-mode toggle */
document.addEventListener("DOMContentLoaded", function () {
  function prefersDark() {
    return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  }
  function isDarkMode() {
    var root = document.documentElement;
    if (root.classList.contains("dark")) return true;
    if (root.classList.contains("light")) return false;
    return prefersDark();
  }

  // Optional folding: wrap .fragment in open <details class="code-details">.
  // Skip fragments already inside details and native Doxygen .foldopen listings.
  document.querySelectorAll(".fragment").forEach(function (frag) {
    if (frag.closest("details.code-details")) return;
    if (frag.querySelector(".foldopen")) return;
    var details = document.createElement("details");
    details.className = "code-details";
    details.open = true;
    var summary = document.createElement("summary");
    summary.textContent = "Code";
    frag.parentNode.insertBefore(details, frag);
    details.appendChild(summary);
    details.appendChild(frag);
  });

  // Copy-to-clipboard on div.fragment (themed .copy-btn only)
  document.querySelectorAll("div.fragment").forEach(function (frag) {
    if (frag.querySelector(".copy-btn")) return;
    var btn = document.createElement("button");
    btn.type = "button";
    btn.className = "copy-btn";
    btn.textContent = "Copy";
    btn.setAttribute("aria-label", "Copy code");
    btn.addEventListener("click", function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      var clone = frag.cloneNode(true);
      var extra = clone.querySelector(".copy-btn");
      if (extra) extra.remove();
      var lines = clone.querySelectorAll(".line");
      var text = lines.length
        ? Array.prototype.map.call(lines, function (l) { return l.textContent; }).join("\n")
        : clone.textContent;
      var done = function () {
        btn.textContent = "Copied!";
        setTimeout(function () { btn.textContent = "Copy"; }, 2000);
      };
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(done).catch(function () {
          /* ignore */
        });
      }
    });
    frag.appendChild(btn);
  });

  // Dark mode toggle
  var toggle = document.getElementById("darkModeToggle");
  if (toggle) {
    function updateIcon() {
      var dark = isDarkMode();
      toggle.innerHTML = dark ? "&#9788;" : "&#9790;";
      toggle.setAttribute("aria-pressed", dark ? "true" : "false");
    }
    updateIcon();
    toggle.addEventListener("click", function () {
      var root = document.documentElement;
      var nextDark = !isDarkMode();
      root.classList.toggle("dark", nextDark);
      root.classList.toggle("light", !nextDark);
      try {
        localStorage.setItem("doxyYoda-theme", nextDark ? "dark" : "light");
      } catch (e) { /* private mode */ }
      updateIcon();
    });
  }
});
</script>
